<!doctype html>
<html lang="pt-BR">
<head>
  <!-- # w Configuração da tela de criação de conta -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar conta - Meu Letterboxd pessoal</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- # w Formulário para cada parceiro criar seu próprio acesso -->
  <main class="login-page">
    <section class="login-card">
      <p class="eyebrow">Meu espaço</p>
      <h1>Criar conta</h1>
      <p class="intro">Escolha seu usuário e senha para começar sua coleção.</p>
      {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post" class="login-form">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" value="{{ username or '' }}" autocomplete="username" required />
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />
        <label for="password_confirmation">Confirmar senha</label>
        <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required />
        <button type="submit">Criar conta</button>
      </form>
      <p class="login-footer">Já tem uma conta? <a href="/login">Entrar</a></p>
    </section>
  </main>
</body>
</html>
