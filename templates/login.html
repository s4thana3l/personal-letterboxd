<!doctype html>
<html lang="pt-BR">
<head>
  <!-- # w Configuração da tela de login -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar - Meu Letterboxd pessoal</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- # w Formulário de autenticação da aplicação privada -->
  <main class="login-page">
    <section class="login-card">
      <p class="eyebrow">Meu espaço</p>
      <h1>Entrar</h1>
      <p class="intro">Acesse sua coleção pessoal de filmes.</p>
      {% if error %}
        <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post" class="login-form">
        <input type="hidden" name="next" value="{{ next }}" />
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Entrar</button>
      </form>
      <p class="login-footer">Ainda não tem uma conta? <a href="/register">Criar conta</a></p>
    </section>
  </main>
</body>
</html>
